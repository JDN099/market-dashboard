services:
  - type: web
    name: marketv
    runtime: python
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python scripts/migrate.py && gunicorn app:app --workers 1 --threads 4 --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: APP_ENV
        value: production
      - key: FLASK_DEBUG
        value: "false"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: VISITOR_COOKIE_SECURE
        value: "true"
      - key: DB_CONNECT_TIMEOUT
        value: "10"
      - key: DB_SSLMODE
        value: require
      - key: LOG_LEVEL
        value: INFO
      - key: MARKETAUX_DOMAINS
        value: apnews.com,cnbc.com,finance.yahoo.com,marketwatch.com,reuters.com
      - key: DATABASE_URL
        sync: false
      - key: MARKETAUX_API_KEY
        sync: false
