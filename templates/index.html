<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-dark text-light">

<nav class="navbar navbar-dark bg-black px-4">
    <span class="navbar-brand fw-bold">Market Dashboard</span>
</nav>

<div class="container mt-4">
    <div class="row">
        <div class="col-md-6">
            <h5>Search Ticker</h5>
            <div class="input-group mb-3">
                <input type="text" class="form-control" id="ticker-input" placeholder="e.g. AAPL, NQ=F">
                <button class="btn btn-success" onclick="searchTicker()">Search</button>
            </div>
            <div id="ticker-result"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/script.js"></script>
</body>
</html>
